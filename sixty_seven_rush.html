<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sixty Seven Rush</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #aab7c8;
      --panel: rgba(11, 15, 24, 0.86);
      --line: rgba(255,255,255,0.18);
      --mint: #70f0a8;
      --gold: #ffd166;
      --coral: #ff6b6b;
      --cyan: #62d5ff;
      --violet: #b692ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #070910;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(135deg, rgba(98,213,255,0.15), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(255,209,102,0.17), transparent 24%),
        radial-gradient(circle at 22% 84%, rgba(112,240,168,0.14), transparent 30%),
        #070910;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      z-index: 3;
      inset: 12px 12px auto 12px;
      display: grid;
      grid-template-columns: repeat(5, minmax(78px, 1fr));
      gap: 8px;
      pointer-events: none;
    }

    .pill,
    .panel,
    .target-meter,
    .pad button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: inset 0 1px rgba(255,255,255,0.08), 0 14px 32px rgba(0,0,0,0.28);
    }

    .pill {
      min-height: 42px;
      padding: 8px 10px;
    }

    .pill span,
    .target-meter span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .pill strong {
      display: block;
      margin-top: 2px;
      font-size: 20px;
      line-height: 1;
    }

    .target-meter {
      position: fixed;
      z-index: 3;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 10px;
      pointer-events: none;
    }

    .track {
      position: relative;
      height: 13px;
      margin-top: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--mint), var(--gold));
      transition: width 90ms linear;
    }

    .pin {
      position: absolute;
      top: -5px;
      bottom: -5px;
      left: calc(67% - 2px);
      width: 4px;
      border-radius: 999px;
      background: var(--coral);
      box-shadow: 0 0 18px rgba(255,107,107,0.75);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 6, 12, 0.68);
      backdrop-filter: blur(5px);
    }

    .panel {
      width: min(660px, 100%);
      padding: 22px;
      text-align: center;
      background: rgba(10, 14, 23, 0.94);
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: clamp(38px, 8vw, 76px);
      line-height: 0.9;
      letter-spacing: 0;
    }

    .panel p {
      margin: 8px auto;
      max-width: 550px;
      color: var(--muted);
      line-height: 1.45;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 16px auto 8px;
      max-width: 500px;
    }

    button {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.09);
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button.primary,
    button.active {
      background: var(--mint);
      color: #06120b;
      border-color: rgba(112,240,168,0.8);
    }

    .pad {
      position: fixed;
      z-index: 4;
      right: 12px;
      bottom: 74px;
      display: none;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
    }

    .pad button {
      color: var(--ink);
      font-size: 20px;
      background: rgba(255,255,255,0.1);
    }

    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      .hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pill strong {
        font-size: 18px;
      }

      .button-row {
        grid-template-columns: 1fr;
      }

      .pad {
        display: grid;
      }

      .target-meter {
        right: 176px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="pill"><span>Total</span><strong id="total">0/67</strong></div>
    <div class="pill"><span>Score</span><strong id="score">0</strong></div>
    <div class="pill"><span>Round</span><strong id="round">1</strong></div>
    <div class="pill"><span>Lives</span><strong id="lives">3</strong></div>
    <div class="pill"><span>Best</span><strong id="best">0</strong></div>
  </div>

  <div class="target-meter">
    <span id="meterLabel">Target 67</span>
    <div class="track"><div class="fill" id="fill"></div><div class="pin"></div></div>
  </div>

  <div class="pad" aria-hidden="true">
    <button class="up" data-key="arrowup">▲</button>
    <button class="left" data-key="arrowleft">◀</button>
    <button class="right" data-key="arrowright">▶</button>
    <button class="down" data-key="arrowdown">▼</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h1 id="title">Sixty Seven Rush</h1>
      <p id="message">Collect number shards until your total is exactly 67. Go over and a life burns. Move with WASD, arrows, touch buttons, or drag toward the pointer.</p>
      <div class="button-row">
        <button class="active" data-mode="steady">Steady</button>
        <button data-mode="sprint">Sprint</button>
        <button data-mode="chaos">Chaos</button>
      </div>
      <button class="primary" id="start">Start</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ui = {
      total: document.getElementById('total'),
      score: document.getElementById('score'),
      round: document.getElementById('round'),
      lives: document.getElementById('lives'),
      best: document.getElementById('best'),
      fill: document.getElementById('fill'),
      meterLabel: document.getElementById('meterLabel'),
      overlay: document.getElementById('overlay'),
      title: document.getElementById('title'),
      message: document.getElementById('message'),
      start: document.getElementById('start')
    };

    const keys = new Set();
    const pointer = { x: innerWidth / 2, y: innerHeight / 2, active: false };
    const modes = {
      steady: { lives: 3, time: 42, speed: 1, spawn: 1 },
      sprint: { lives: 3, time: 30, speed: 1.14, spawn: 1.2 },
      chaos: { lives: 2, time: 25, speed: 1.28, spawn: 1.42 }
    };

    let dpr = 1;
    let last = performance.now();
    let running = false;
    let mode = 'steady';
    let best = Number(localStorage.getItem('sixtySevenRushBest') || 0);

    const game = {
      score: 0,
      round: 1,
      lives: 3,
      total: 0,
      time: 42,
      shake: 0,
      spawnTimer: 0,
      shards: [],
      hazards: [],
      particles: [],
      text: [],
      player: { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0, r: 18, speed: 440, invuln: 0 }
    };

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function choice(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function reset() {
      const diff = modes[mode];
      Object.assign(game, {
        score: 0,
        round: 1,
        lives: diff.lives,
        total: 0,
        time: diff.time,
        shake: 0,
        spawnTimer: 0,
        shards: [],
        hazards: [],
        particles: [],
        text: []
      });
      Object.assign(game.player, {
        x: innerWidth / 2,
        y: innerHeight / 2,
        vx: 0,
        vy: 0,
        r: 18,
        speed: 440,
        invuln: 0
      });
      for (let i = 0; i < 12; i++) spawnShard();
      for (let i = 0; i < 4; i++) spawnHazard();
      ui.overlay.classList.add('hidden');
      running = true;
      updateUi();
    }

    function spawnShard() {
      const remaining = Math.max(1, 67 - game.total);
      const helpful = Math.random() < 0.48;
      const value = helpful ? choice([1, 2, 3, 4, 5, 6, 7, 10, 12, Math.min(remaining, 17)].filter(Boolean)) : choice([8, 9, 11, 13, 16, 19, 23]);
      game.shards.push({
        x: rand(40, innerWidth - 40),
        y: rand(78, innerHeight - 90),
        vx: rand(-45, 45),
        vy: rand(-45, 45),
        r: 17,
        value,
        pulse: rand(0, Math.PI * 2)
      });
    }

    function spawnHazard() {
      const edge = Math.floor(rand(0, 4));
      const h = {
        x: edge === 1 ? innerWidth + 40 : edge === 0 ? -40 : rand(0, innerWidth),
        y: edge === 3 ? innerHeight + 40 : edge === 2 ? -40 : rand(0, innerHeight),
        r: rand(15, 24),
        a: rand(0, Math.PI * 2)
      };
      const angle = Math.atan2(game.player.y - h.y, game.player.x - h.x) + rand(-0.55, 0.55);
      const speed = rand(90, 175) * modes[mode].speed * (1 + game.round * 0.06);
      h.vx = Math.cos(angle) * speed;
      h.vy = Math.sin(angle) * speed;
      game.hazards.push(h);
    }

    function burst(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const a = rand(0, Math.PI * 2);
        const s = rand(80, 330);
        game.particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          r: rand(2, 5),
          life: rand(0.28, 0.75),
          max: 0.75,
          color
        });
      }
    }

    function pop(text, x, y, color) {
      game.text.push({ text, x, y, vy: -34, life: 0.9, color });
    }

    function scoreExact() {
      const bonus = Math.max(0, Math.ceil(game.time)) * 67;
      game.score += 1000 + bonus + game.round * 250;
      game.round += 1;
      game.total = 0;
      game.time = Math.max(18, modes[mode].time - game.round * 1.5);
      game.player.speed += 16;
      game.shards.length = 0;
      game.hazards.length = 0;
      for (let i = 0; i < 10 + game.round; i++) spawnShard();
      for (let i = 0; i < 3 + Math.min(8, game.round); i++) spawnHazard();
      burst(game.player.x, game.player.y, '#70f0a8', 40);
      pop('67!', game.player.x, game.player.y - 20, '#70f0a8');
    }

    function hurt(reason) {
      if (game.player.invuln > 0) return;
      game.lives -= 1;
      game.total = Math.max(0, Math.floor(game.total / 2));
      game.player.invuln = 1.1;
      game.shake = 10;
      burst(game.player.x, game.player.y, '#ff6b6b', 28);
      pop(reason, game.player.x, game.player.y - 22, '#ff6b6b');
      if (game.lives <= 0) gameOver();
    }

    function gameOver() {
      running = false;
      best = Math.max(best, game.score);
      localStorage.setItem('sixtySevenRushBest', String(best));
      ui.title.textContent = 'Rush Over';
      ui.message.textContent = `Score ${game.score}. Best ${best}. Exact 67 is still sitting there, looking very collectable.`;
      ui.start.textContent = 'Restart';
      ui.overlay.classList.remove('hidden');
      updateUi();
    }

    function movePlayer(dt) {
      const p = game.player;
      let dx = 0;
      let dy = 0;
      if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
      if (keys.has('d') || keys.has('arrowright')) dx += 1;
      if (keys.has('w') || keys.has('arrowup')) dy -= 1;
      if (keys.has('s') || keys.has('arrowdown')) dy += 1;
      if (dx === 0 && dy === 0 && pointer.active) {
        dx = pointer.x - p.x;
        dy = pointer.y - p.y;
        if (Math.hypot(dx, dy) < 18) {
          dx = 0;
          dy = 0;
        }
      }
      const len = Math.hypot(dx, dy) || 1;
      p.vx += dx / len * p.speed * dt * 7;
      p.vy += dy / len * p.speed * dt * 7;
      p.vx *= Math.pow(0.0009, dt);
      p.vy *= Math.pow(0.0009, dt);
      p.x = clamp(p.x + p.vx * dt, p.r, innerWidth - p.r);
      p.y = clamp(p.y + p.vy * dt, 62 + p.r, innerHeight - 64 - p.r);
      p.invuln = Math.max(0, p.invuln - dt);
    }

    function update(dt) {
      if (!running) return;
      game.time -= dt;
      game.spawnTimer -= dt;
      game.shake = Math.max(0, game.shake - dt * 18);
      if (game.time <= 0) hurt('time');
      if (game.time <= 0 && running) game.time = Math.max(14, modes[mode].time - game.round);

      movePlayer(dt);

      if (game.spawnTimer <= 0) {
        game.spawnTimer = rand(0.45, 0.9) / modes[mode].spawn;
        spawnShard();
        if (Math.random() < 0.54) spawnHazard();
      }

      for (const shard of game.shards) {
        shard.x += shard.vx * dt;
        shard.y += shard.vy * dt;
        shard.pulse += dt * 5;
        if (shard.x < 24 || shard.x > innerWidth - 24) shard.vx *= -1;
        if (shard.y < 74 || shard.y > innerHeight - 82) shard.vy *= -1;
      }

      for (const h of game.hazards) {
        h.x += h.vx * dt;
        h.y += h.vy * dt;
        h.a += dt * 3;
        if (h.x < -70 || h.x > innerWidth + 70 || h.y < -70 || h.y > innerHeight + 70) {
          h.dead = true;
        }
      }

      for (const shard of game.shards) {
        if (Math.hypot(shard.x - game.player.x, shard.y - game.player.y) < shard.r + game.player.r) {
          game.total += shard.value;
          game.score += shard.value * 11;
          shard.dead = true;
          burst(shard.x, shard.y, game.total === 67 ? '#70f0a8' : '#ffd166', 14);
          pop(`+${shard.value}`, shard.x, shard.y, '#ffd166');
          if (game.total === 67) scoreExact();
          if (game.total > 67) hurt('over');
        }
      }

      for (const h of game.hazards) {
        if (Math.hypot(h.x - game.player.x, h.y - game.player.y) < h.r + game.player.r) {
          h.dead = true;
          hurt('hit');
        }
      }

      for (const p of game.particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.pow(0.025, dt);
        p.vy *= Math.pow(0.025, dt);
        p.life -= dt;
      }

      for (const t of game.text) {
        t.y += t.vy * dt;
        t.life -= dt;
      }

      game.shards = game.shards.filter(s => !s.dead).slice(-42);
      game.hazards = game.hazards.filter(h => !h.dead).slice(-28);
      game.particles = game.particles.filter(p => p.life > 0);
      game.text = game.text.filter(t => t.life > 0);
      updateUi();
    }

    function updateUi() {
      ui.total.textContent = `${game.total}/67`;
      ui.score.textContent = game.score;
      ui.round.textContent = game.round;
      ui.lives.textContent = game.lives;
      ui.best.textContent = best;
      const pct = clamp(game.total / 100 * 100, 0, 100);
      ui.fill.style.width = pct + '%';
      ui.meterLabel.textContent = `Target 67 · ${Math.max(0, Math.ceil(game.time))}s`;
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let x = -40; x < innerWidth + 40; x += 44) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 80, innerHeight);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      ctx.save();
      if (game.shake > 0) ctx.translate(rand(-game.shake, game.shake), rand(-game.shake, game.shake));
      drawGrid();

      for (const shard of game.shards) {
        const glow = 3 + Math.sin(shard.pulse) * 2;
        ctx.save();
        ctx.translate(shard.x, shard.y);
        ctx.rotate(shard.pulse * 0.25);
        ctx.fillStyle = shard.value <= Math.max(1, 67 - game.total) ? '#ffd166' : '#b692ff';
        ctx.shadowBlur = 14 + glow;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.roundRect(-20, -18, 40, 36, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#071014';
        ctx.font = '900 18px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(shard.value, 0, 1);
        ctx.restore();
      }

      for (const h of game.hazards) {
        ctx.save();
        ctx.translate(h.x, h.y);
        ctx.rotate(h.a);
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowBlur = 18;
        ctx.shadowColor = '#ff6b6b';
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          const r = i % 2 ? h.r * 0.62 : h.r;
          ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      const p = game.player;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = p.invuln > 0 && Math.floor(performance.now() / 90) % 2 ? 0.48 : 1;
      ctx.fillStyle = '#62d5ff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#62d5ff';
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#061017';
      ctx.font = '900 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('67', 0, 1);
      ctx.restore();

      for (const part of game.particles) {
        ctx.globalAlpha = clamp(part.life / part.max, 0, 1);
        ctx.fillStyle = part.color;
        ctx.beginPath();
        ctx.arc(part.x, part.y, part.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const t of game.text) {
        ctx.globalAlpha = clamp(t.life, 0, 1);
        ctx.fillStyle = t.color;
        ctx.font = '900 21px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => {
        mode = button.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach(item => item.classList.toggle('active', item === button));
      });
    });

    ui.start.addEventListener('click', reset);

    addEventListener('keydown', event => {
      keys.add(event.key.toLowerCase());
      if (event.key === 'Enter' && !running) reset();
    });

    addEventListener('keyup', event => keys.delete(event.key.toLowerCase()));

    addEventListener('pointerdown', event => {
      pointer.active = true;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });

    addEventListener('pointermove', event => {
      pointer.x = event.clientX;
      pointer.y = event.clientY;
    });

    addEventListener('pointerup', () => {
      pointer.active = false;
    });

    document.querySelectorAll('.pad button').forEach(button => {
      const key = button.dataset.key;
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        keys.add(key);
      });
      button.addEventListener('pointerup', () => keys.delete(key));
      button.addEventListener('pointercancel', () => keys.delete(key));
      button.addEventListener('pointerleave', () => keys.delete(key));
    });

    resize();
    addEventListener('resize', resize);
    updateUi();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
